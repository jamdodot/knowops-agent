# Prompt 登记表（随 prompt 走）。
#
# 与 config/prompts.yaml 的分工：
#   本文件 = 登记（有哪些 prompt、各自的契约与指纹）
#   config/prompts.yaml = 策略（门禁、灰度、版本规则）
#
# template_sha256 由 `python scripts/kw.py prompt-lock` 生成并回填，**不要手改**。
# 手写 hash 等于没有 hash：它只能证明"我抄了一个 64 位字符串"，不能证明内容没变。
# `kw.py verify` 会在 CI 里校验它与文件实际内容一致（12 §6）。

version: 1

prompts:

