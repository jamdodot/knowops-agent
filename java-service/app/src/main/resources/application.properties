# KnowOps 业务服务配置
server.port=8080

# 契约版本（docs/13 §7.1）：双向声明，不匹配返回 426
knowops.contract-version=1.0.0

# Python Agent 服务入口（同镜像，DOMAIN 区分）
knowops.agent.knowledge-base-url=http://localhost:8001
knowops.agent.fulfillment-base-url=http://localhost:8002

# 整体预算：Java -> Python 的剩余毫秒（docs/13 §5.1 传剩余预算，不传绝对时间）
knowops.agent.default-deadline-ms=15000

# M0 骨架：数据库走内存实现，不真连 PG
knowops.storage.mode=memory

# 上传文件的本地落盘目录（M0 未接 MinIO）
knowops.upload.dir=./data/uploads
