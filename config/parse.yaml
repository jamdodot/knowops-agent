# KnowOps 文档解析配置
#
# 决策依据：docs/09-文档解析设计.md 第 5 节（最终方案：Docling 主力，MinerU 兜底）
# 硬件前提：CPU-only，16GB 内存，无独显
#
# 设计要点：解析是按【页】路由的，不是按文件。一份 300 页报告可能前 10 页是扫描件、
# 后面全是数字原生，整份一刀切必然有一半处理错。

version: 1

# ---------------------------------------------------------------------------
# 0. 运行形态总开关（默认全本地）
# ---------------------------------------------------------------------------
# local  = 全部解析在本机跑：不用 key、不用配额、原文不出域、断网可用
# hybrid = 只有兜底那一路改走 MinerU 官方云 API（省 3GB 内存，代价是原文出域）
#
# 切换只改这一个值。四路路由、IR、下游 chunker 都不用动——
# 这是"按页路由 + 统一 IR"的额外红利：托管形态可以后置决定。

parse_mode: local

# ---------------------------------------------------------------------------
# 0b. 引擎形态（事实层面：三个纯库，一个两种形态都有）
# ---------------------------------------------------------------------------
# 默认全本地的理由不是"云不可用"，而是本地更简单：不占一个 key、不受配额约束、
# 原文不出域、离线能演示、成本可预测。云唯一的收益是省 3GB 内存，
# 换的是上面五条全部放弃——在当前阶段不划算。

engines:

  pymupdf:
    deploy: local_lib             # 没有任何线上 API，也不需要有
    role: L0 文字层直取
    latency: 毫秒级/页
    license: AGPL-3.0             # ← 注意：商用/闭源需 Artifex 商业授权
    license_fallback: pypdfium2   # Apache-2.0，同能力，速度接近，接口不同需包一层
    notes: |
      AGPL 是这一栈里最容易被漏掉的许可——因为它看起来只是个"工具函数"。
      作品集自用无碍；一旦要闭源商用，换 pypdfium2 或买授权。
      判断写进 ADR，别等到法务审查时才发现。

  camelot:
    deploy: local_lib
    role: 规则表格
    license: MIT
    external_dep: ghostscript     # Windows 上未装会直接抛错
    notes: 只处理有矢量线条的规则表格，读矢量比跑模型更准。

  docling:
    deploy: local_lib             # 主力：pip 即用，纯 CPU
    role: L1 主力（Office 全格式 + PDF 语义解析）
    latency: 1~3 秒/页
    license: MIT
    serve_mode:
      available: true             # docling-serve：自托管 REST（/v1/convert/file）
      use: false                  # 单机单进程没必要多一层 HTTP；多实例/跨语言才启用
      notes: |
        docling-serve 是自托管服务，不是云服务：它解决"把解析变成 HTTP 接口"，
        不解决"没有算力"。镜像 4.4GB 起，普通电脑上纯属负担。
        官方没有公开 SaaS；IBM watsonx 有托管版，但那是企业采购路径。
    notes: |
      唯一"主力"引擎，因为它是唯一一个：许可证干净（MIT）+ 格式全覆盖 + CPU 原生。
      改用它当主力，MinerU 才能完全移出关键路径。

  mineru:
    deploy: local                 # 本地管道后端，CPU 可跑
    deploy_alt: cloud_api         # 备选：官方 API（parse_mode: hybrid 时启用，默认不用）
    role: 兜底专家（扫描件 / 中文复杂版面 / 质量闸门不通过）
    license: Apache-2.0 + 商用阈值 # 若走在线服务需署名
    backend: pipeline             # 用 pipeline 不用 vlm：无幻觉、CPU 可跑
    weights:
      first_run_download_mb: 1500 # 首次约 1~2GB，必须提前预制
      prebake: true
    notes: |
      本地跑的真实代价只有一条：内存峰值 3~5GB，所以并发必须锁 1。
      它是四个工具里唯一有官方在线 API 的，但默认不用——
      省下 3GB 内存不值"原文出域 + 多一个 key + 多一层配额"这几件事。

# ---------------------------------------------------------------------------
# 1. 探测（每页独立执行，开销很小）
# ---------------------------------------------------------------------------
# text_coverage = 该页能直接抽出的字符数 / 该页估算字符容量
# layout_complexity = 多栏 / 公式 / 合并单元格 / 竖排的密度评分（0~1）

probe:
  text_coverage_high: 0.90        # 高于此值 → L0 直取
  text_coverage_low: 0.40         # 低于此值 → 视为扫描件
  layout_complexity_high: 0.70    # 高于此值 → 直接交给兜底引擎，跳过 Docling
  sample_pages: 3                 # 长文档先抽样探测，避免全量遍历
  per_page: true                  # 关键：按页判断

# ---------------------------------------------------------------------------
# 2. 路由（四路）
# ---------------------------------------------------------------------------
# 引擎分工的逻辑：Docling 覆盖全部格式且 MIT 许可，所以是主力；
# MinerU 只在"Docling 啃不动"或"没有文字层"时出现，不在关键路径上。

routes:

  office:                         # .docx / .pptx / .xlsx / .html / .md
    engine: docling
    notes: |
      Docling 原生支持这些格式并输出 DoclingDocument IR，
      不要用 python-docx 自己拼——会丢掉样式层级和表格结构。

  native:                         # PDF 且有文字层（覆盖率 > 0.90）
    engine: pymupdf
    table: auto                   # 见下方 3. 表格处理链
    strip_running_headers: true
    notes: |
      最快也最准的一层，毫秒级/页，内存几十 MB。
      OCR 反而会引入识别错误，有文字层就绝不走 OCR。

  pipeline:                       # PDF，覆盖率 0.40~0.90
    engine: docling
    backend: docling-parse
    device: cpu
    ocr_fallback: true            # 局部无文字层的页交给 OCR，不整份重跑
    notes: |
      Docling 的 TableFormer 对表格结构还原够用，CPU 可跑。
      中文竖排与复杂合并单元格是它的弱项，由 quality_gate 转到 rescue。

  scanned:                        # 覆盖率 < 0.40，纯扫描件
    engine: mineru
    deploy: local                 # 本地管道后端，与 parse_mode 一致
    backend: pipeline
    ocr: true
    lang: [ch, en]
    concurrency: 1                # 峰值 3~5GB，并发必 OOM

# ---------------------------------------------------------------------------
# 3. 表格处理链（这是 RAG 最容易静默失败的地方）
# ---------------------------------------------------------------------------
# 表格在向量库里会变成扁平数字：chunk 看着正常，回答却微妙地、自信地错。
# 所以表格不追求"文本对"，追求"结构对"。

table:
  strategy: cascade
  chain:
    - camelot                     # 直接读 PDF 矢量线条，规则表格最准、不需要模型
    - pdfplumber                  # camelot 不可用时的退化
    - docling_tableformer         # 前两者都失败（无边框 / 复杂合并）才用模型
  output_format: html             # 必须保 rowspan/colspan，markdown 表格承载不了
  min_cells: 4                    # 小于此规模当普通文本，不单独建块
  merge_cross_page: true          # 跨页表格合并（Docling 弱，MinerU 强，rescue 时补）
  notes: |
    Windows 上 Camelot 依赖 Ghostscript，没装会直接报错。
    所以 chain 里放了 pdfplumber 作为第二级——这不是冗余，
    是给"装不上 ghostscript 的机器"留的可运行路径。

# ---------------------------------------------------------------------------
# 4. 质量闸门（决定要不要调兜底引擎）
# ---------------------------------------------------------------------------
# 兜底必须是有条件的，不能是默认路径：MinerU 在 CPU 上 2~10 秒/页、峰值 3~5GB，
# 全量跑会把入库变成通宵任务。

quality_gate:
  min_table_integrity: 0.85       # 表格单元格完整率
  min_reading_order_conf: 0.70    # 阅读顺序置信度（顺序错，embedding 救不回）
  max_header_footer_leak: 0.05    # 重复行占比（见下）
  on_fail: rescue_then_review

rescue:
  engine: mineru
  deploy: local                   # 本地进程，跑完即退
  backend: pipeline
  max_attempts: 1                 # 只兜底一次，不递归重试
  timeout_s: 900                  # 单份 15 分钟上限
  memory_cap_mb: 5120             # 超限即放弃并进复核队列，防止把机器跑崩
  notes: |
    兜底是有条件的，不能是默认路径：MinerU 慢且吃内存，全量跑会把入库变成通宵任务。
    只在"Docling 啃不动"时出现，默认路径永远是 L0 直取 + Docling。
    ⚠ 首次运行会下载约 1~2GB 权重，必须提前预制，
    否则第一次入库会卡在下载上，而且报错信息很不明确。

# ---------------------------------------------------------------------------
# 4b. MinerU 云 API（备选通道，默认关闭）
# ---------------------------------------------------------------------------
# 保留这一段的目的不是"以后可能用"，而是它把接口约束写清楚了：
# 云 API 是【异步任务制】，跟本地库的同步调用假设完全不同。
# 一旦 parse_mode 改成 hybrid，这条链路要能直接接上，不用重新设计。

mineru_cloud:
  enabled: false                  # parse_mode: hybrid 时才置 true
  api_base: ${MINERU_API_BASE:-https://mineru.net/api/v4}
  auth: env:MINERU_API_KEY
  mode: async                     # 异步任务：submit → poll → download
  poll_interval_s: 5
  submit_retry: 2
  download_retry: 3
  max_pages_per_file: 200         # 云端单文件页数上限，超了先本地分册
  result_format: [md, content_list]   # content_list 带 bbox 与 type，是喂 IR 的关键
  artifact_ttl_h: 24              # 结果链接有时效，必须及时落盘
  residency: 原文上传第三方
  notes: |
    启用时要补三件事：
    ① 任务表落库（task_id、状态、产物路径），进程重启能续，不能只活在内存里
    ② 幂等：同一份文件重复提交要能识别，云按次计费，重试不能重复花钱
    ③ 超时与降级要带 degraded 标记，禁止静默失败
    免费额度各入口宣传不一致（官网说每天约 2000 页，第三方目录站说免费版仅 5 页
    且不含 API），真要启用必须以控制台实测为准，别拿宣传数字做设计假设。

# ---------------------------------------------------------------------------
# 5. 清洗（对检索质量的影响可能大于识别准确率）
# ---------------------------------------------------------------------------

clean:
  strip_header_footer: true       # 最重要的清洗项
  header_footer_repeat_ratio: 0.6 # 同一行文本在 >60% 页面出现即判为页眉页脚
  strip_watermark: true
  strip_page_number: true
  merge_hyphenation: true         # 跨行连字符复原
  normalize_whitespace: true
  drop_toc: true                  # 目录页对检索无价值，且高度重复
  drop_cover: true                # 首页封面（标题+日期）也是噪声
  notes: |
    页眉页脚不清洗是"没洗掉"而不是"识别错"，所以特别难查：
    200 页的页眉会在向量空间里形成 200 个几乎相同的点，
    查询时挤掉真正该召回的内容，表现出来只是"检索质量莫名变差"。

# ---------------------------------------------------------------------------
# 6. 输出：统一 IR（唯一出口）
# ---------------------------------------------------------------------------
# 下游只认 IR，不认引擎。这是"换引擎不改下游"成立的前提。
# 只输出 Markdown 会丢掉页码（引用无法定位）、bbox（无法高亮溯源）、块类型（无法差异化分块）。

ir:
  block_types: [title, heading, paragraph, list, table, figure, caption, formula, code, footnote]
  fields: [id, doc_id, type, content, page_no, bbox, level, parent_id, order_index]
  coordinate_system: pdf_points   # 保留原始坐标系，渲染时再换算
  persist: jsonb                  # 落到 parse_report / kb_parent_chunk
  version: "v1"                   # IR 结构变更要 bump，与 chunker_version 一起进 trace

# ---------------------------------------------------------------------------
# 7. 幂等与缓存
# ---------------------------------------------------------------------------

cache:
  key: sha256(file_bytes)         # 内容寻址：文件内容没变就不重复解析
  store: local_dir
  dir: var/parse_cache
  version_in_key: true            # 解析器版本进 key，升级引擎后不会命中旧产物
  notes: |
    解析是整个入库链路里最贵的一步（CPU 时间 + 内存峰值）。
    改分块策略时不应该触发重新解析，这就是缓存存在的意义。

# ---------------------------------------------------------------------------
# 8. 并发与资源（普通电脑的纪律）
# ---------------------------------------------------------------------------

resources:
  max_concurrent_docs: 2          # Docling / PyMuPDF 可以 2
  mineru_concurrent: 1            # 内存峰值 3~5GB，并发必 OOM
  cpu_threads_per_doc: 4
  max_file_size_mb: 200
  max_pages: 800                  # 超长文档分册处理，不整份塞进去
  schedule_hint: offline          # 只在入库时跑，绝不进请求链路
  peak_local_mb: 5120             # 含 MinerU 兜底的峰值；不含它时约 2GB
  notes: |
    入库期间不要同时跑评测或大批量问答，两者内存峰值会叠加。
    16GB 机器按这个配置安全；8GB 机器把 scanned 一路延后、
    或把 MinerU 改成"一次只跑 5~10 份"的批处理，其余两路照常。

# ---------------------------------------------------------------------------
# 9. 上报指标（进 parse_report，不做这步后面全在猜）
# ---------------------------------------------------------------------------

report:
  fields:
    - engine                      # 实际用了哪个引擎
    - deploy                      # local / cloud_api —— 归因要能区分"本地慢"和"云端排队"
    - route                       # 走了哪一路
    - text_coverage
    - table_count
    - table_integrity
    - reading_order_conf
    - header_footer_leak          # 标准 benchmark 不测，但对检索影响可能大于表格还原率
    - elapsed_ms
    - peak_memory_mb
    - rescued                     # 是否触发过兜底
    - review_required
  emit_to: [db.parse_report, otel]

# ---------------------------------------------------------------------------
# 10. 失败处理
# ---------------------------------------------------------------------------

on_failure:
  low_confidence: queue_for_review     # 进复核队列，不阻塞流水线
  engine_error: retry_once_then_queue
  unsupported_format: reject_with_reason
  never: silent_skip                   # 绝不静默跳过——那是"文档消失了但没人知道"
